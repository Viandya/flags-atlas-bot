<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Атлас наизусть</title>
<style>
:root{
  --tg-inset-top:0px; --tg-inset-bottom:0px;
  padding-top:calc(env(safe-area-inset-top,0px) + var(--tg-inset-top));
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + var(--tg-inset-bottom));
}
html,body{ margin:0; }
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one column, fixed bottom bar, card stack in the middle — sized like a phone screen */
:root{
  --bg:#EAEEF0;
  --surface:#FFFFFF;
  --line:#C9D4D8;
  --ink:#0D1D24;
  --muted:#5B7078;
  --accent:#0E6E62;
  --accent-soft:#D6EAE5;
  --on-accent:#FFFFFF;
  --bad:#C4432C;
  --bad-soft:#F6DCD6;
  --gold:#B7761F;
  --sea:#DDE5E8;
  --land:#BFCCD1;
  --font-display:'Bricolage Grotesque','Trebuchet MS',sans-serif;
  --font-body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --font-mono:'JetBrains Mono','SFMono-Regular',Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1418; --surface:#112127; --line:#22383F;
    --ink:#E4EEF0; --muted:#8AA3AB; --accent:#3FC3AC; --accent-soft:#13322E;
    --on-accent:#04201C; --bad:#F0705A; --bad-soft:#3A1B14; --gold:#E0A83E;
    --sea:#0D1B21; --land:#27404A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1418; --surface:#112127; --line:#22383F;
  --ink:#E4EEF0; --muted:#8AA3AB; --accent:#3FC3AC; --accent-soft:#13322E;
  --on-accent:#04201C; --bad:#F0705A; --bad-soft:#3A1B14; --gold:#E0A83E;
  --sea:#0D1B21; --land:#27404A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
html{height:var(--tg-viewport-stable-height, 100dvh)}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--font-body);font-size:16px;line-height:1.45;
  -webkit-tap-highlight-color:transparent;
}
#app{min-height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:16px 16px 92px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.02em}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* menu */
.hero{display:flex;flex-direction:column;gap:6px;padding:10px 2px 18px}
.hero h1{font-size:34px;line-height:1.05}
.hero p{margin:0;color:var(--muted);font-size:14px;max-width:38ch}
.modes{display:grid;gap:10px}
.mode{
  display:grid;grid-template-columns:54px 1fr auto;align-items:center;gap:14px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;text-align:left;transition:border-color .15s,transform .08s;
}
.mode:active{transform:scale(.99)}
.mode:hover{border-color:var(--accent)}
.mode .ico{display:grid;place-items:center}
.mode .ico img{width:44px;border-radius:4px;border:1px solid var(--line);display:block}
.mode .ico svg{width:44px;height:30px}
.mode b{display:block;font-family:var(--font-display);font-size:17px}
.mode span.sub{display:block;font-size:13px;color:var(--muted)}
.mode .go{font-family:var(--font-mono);color:var(--accent);font-size:18px}
.best{margin-top:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.best div{background:var(--surface);padding:12px 10px;text-align:center}
.best strong{display:block;font-family:var(--font-mono);font-size:20px;font-variant-numeric:tabular-nums}
.best small{color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}

/* quiz */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.topbar .back{font-family:var(--font-mono);font-size:13px;color:var(--muted);padding:6px 10px;border:1px solid var(--line);border-radius:999px;flex:none}
.score{margin-left:auto;font-family:var(--font-mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);flex:none}
.bar{height:4px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.stage{display:grid;place-items:center;gap:10px;padding:22px 12px 26px;background:var(--surface);border:1px solid var(--line);border-radius:18px;margin-bottom:14px}
.bigflag{width:min(230px,62vw);aspect-ratio:4/3;object-fit:cover;border-radius:7px;border:1px solid var(--line);box-shadow:0 8px 22px rgba(0,0,0,.18);display:block}
.qtext{font-family:var(--font-display);font-size:27px;text-align:center;line-height:1.15}
.qhint{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.opts{display:grid;gap:9px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;text-align:left;font-size:16px;display:flex;align-items:center;gap:12px;transition:background .12s,border-color .12s;min-height:54px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.opt.no{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.flaggrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.flagopt{padding:10px;justify-content:center}
.flagopt img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:5px;border:1px solid var(--line);display:block}
.next{margin-top:14px;width:100%;background:var(--accent);color:var(--on-accent);border-radius:12px;padding:15px;font-weight:600;font-size:16px}
.feedback{margin-top:12px;font-size:14px;color:var(--muted);min-height:22px;text-align:center;display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap}
.feedback img{width:26px;border-radius:3px;border:1px solid var(--line)}

/* map */
.mapwrap{background:var(--sea);border:1px solid var(--line);border-radius:14px;padding:6px;margin-bottom:12px}
#worldmap{display:block;width:100%;height:auto;max-width:100%}
#worldmap .base{fill:var(--land);opacity:.45}
#worldmap .c{fill:var(--land);stroke:var(--sea);stroke-width:.6;transition:fill .45s ease}
#worldmap .c.on{fill:var(--accent)}
#worldmap .c.miss{fill:var(--bad);opacity:.7}
#worldmap circle.c{stroke-width:.8}
#worldmap circle.c.on{r:5}
.maplegend{display:flex;gap:14px;justify-content:center;margin:-4px 0 12px;font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.maplegend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* marathon */
.mstats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px}
.mstats div{background:var(--surface);padding:10px;text-align:center}
.mstats strong{display:block;font-family:var(--font-mono);font-size:19px;font-variant-numeric:tabular-nums}
.mstats small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#answer{width:100%;padding:15px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:17px}
#answer::placeholder{color:var(--muted)}
.regions{display:grid;gap:9px;margin-top:14px}
.reg{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;font-size:13px}
.reg .rbar{grid-column:1/-1;height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.reg .rbar i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s}
.reg b{font-weight:600}
.reg span{font-family:var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{font-size:13px;padding:4px 10px 4px 5px;border-radius:999px;background:var(--accent-soft);border:1px solid var(--accent);display:flex;gap:6px;align-items:center}
.chip img{width:20px;border-radius:2px;display:block}
.chip.missed{background:transparent;border-color:var(--line);color:var(--muted)}
.ghost{width:100%;margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:13px;color:var(--muted);font-size:14px}

/* result */
.result{text-align:center;padding:26px 18px}
.result .big{font-family:var(--font-mono);font-size:54px;font-variant-numeric:tabular-nums;line-height:1}
.result h2{font-size:24px;margin:10px 0 4px}
.result p{color:var(--muted);margin:0;font-size:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}
.row .next,.row .ghost{margin:0}

/* bottom bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:8px}
.tabbar button{font-size:12px;color:var(--muted);padding:8px 14px;border-radius:10px;font-family:var(--font-mono);letter-spacing:.06em}
.tabbar button.on{color:var(--accent);background:var(--accent-soft)}
@media (max-width:380px){.hero h1{font-size:28px}.qtext{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const REGIONS = {EU:'Европа', AS:'Азия', AF:'Африка', AM:'Америка', OC:'Океания'};

const COUNTRIES = RAW.trim().split('\n').map(function(line){
  const p = line.split('|');
  return {code:p[0], name:p[1], capital:p[2], region:p[3]};
});
const BY_CODE = {};
COUNTRIES.forEach(function(c){ BY_CODE[c.code] = c; });

/* --- разговорные и альтернативные названия для марафона --- */
const ALIASES = {
  'сша':'US','америка':'US','штаты':'US','соединенныештатыамерики':'US','соединенныештаты':'US',
  'англия':'GB','британия':'GB','соединенноекоролевство':'GB','uk':'GB',
  'голландия':'NL','бирма':'MM','бурма':'MM',
  'берегслоновойкости':'CI','котдивуар':'CI','ивуар':'CI',
  'свазиленд':'SZ','южнаяафрика':'ZA','южноафриканскаяреспублика':'ZA',
  'кндр':'KP','кореясеверная':'KP','республикакорея':'KR','корея':'KR','кореяюжная':'KR',
  'чешскаяреспублика':'CZ','кыргызстан':'KG','молдавия':'MD','белоруссия':'BY',
  'объединенныеарабскиеэмираты':'AE','обьединенныеарабскиеэмираты':'AE','эмираты':'AE',
  'центральноафриканскаяреспублика':'CF','дрк':'CD','демократическаяреспубликаконго':'CD',
  'конгокиншаса':'CD','заир':'CD','конго':'CG','конгобраззавиль':'CG',
  'капверде':'CV','островазеленогомыса':'CV','тиморлесте':'TL','святойпрестол':'VA',
  'македония':'MK','босния':'BA','сейшелы':'SC','багамскиеострова':'BS','коморскиеострова':'KM',
  'мальдивскиеострова':'MV','папуановаягвинея':'PG','доминикана':'DO','бирманскийсоюз':'MM',
  'туркия':'TR','бутанскоекоролевство':'BT','вьетнамскаяреспублика':'VN'
};
function norm(s){ return s.toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9]/g,''); }
const BY_NORM = {};
COUNTRIES.forEach(function(c){ BY_NORM[norm(c.name)] = c.code; });
Object.keys(ALIASES).forEach(function(k){ BY_NORM[k] = ALIASES[k]; });

/* ---------- утилиты ---------- */
const app = document.getElementById('app');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(n,exclude){ return shuffle(COUNTRIES.filter(function(c){return c.code!==exclude;})).slice(0,n); }
function store(key,val){ try{ if(val===undefined) return localStorage.getItem(key); localStorage.setItem(key,val); }catch(e){ return null; } }
function haptic(kind){ try{ window.Telegram && Telegram.WebApp.HapticFeedback.notificationOccurred(kind); }catch(e){} }
function esc(s){ return String(s).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];}); }
function flagImg(code,cls,alt){
  return '<img class="'+(cls||'')+'" src="'+FLAGS[code]+'" alt="'+esc(alt||'')+'" loading="lazy">';
}

/* ---------- карта ---------- */
function mapSVG(){
  let s = '<svg id="worldmap" viewBox="0 0 '+MAP.w+' '+MAP.h+'" role="img" aria-label="Карта мира">';
  s += '<path class="base" d="'+MAP.base+'"></path>';
  for(const cc in MAP.paths){
    s += '<path class="c" id="m-'+cc+'" d="'+MAP.paths[cc]+'"><title>'+esc(BY_CODE[cc].name)+'</title></path>';
  }
  for(const cc in MAP.dots){
    const p = MAP.dots[cc];
    s += '<circle class="c" id="m-'+cc+'" cx="'+p[0]+'" cy="'+p[1]+'" r="3"><title>'+esc(BY_CODE[cc].name)+'</title></circle>';
  }
  return s + '</svg>';
}
function paintMap(code, cls){
  const el = document.getElementById('m-'+code);
  if(el) el.classList.add(cls || 'on');
}

/* ---------- состояние ---------- */
const ROUND = 15;
let state = null;

/* ---------- меню ---------- */
function renderMenu(){
  if(state && state.timer) clearInterval(state.timer);
  state = null;
  const globe = '<svg viewBox="0 0 44 30" aria-hidden="true"><rect width="44" height="30" rx="3" fill="var(--sea)"/>'+
    '<path d="M6 8h8l4 5-3 6 5 4 6-3 4 4 6-2v6H6z" fill="var(--land)"/>'+
    '<path d="M12 4h10l3 4-6 3-5-3z" fill="var(--accent)"/></svg>';
  const modes = [
    {id:'flag2country', ico:flagImg('JP','',''),  title:'Флаг → страна',  sub:'15 флагов, четыре варианта'},
    {id:'country2flag', ico:flagImg('BR','',''),  title:'Страна → флаг',  sub:'Узнать полотнище по названию'},
    {id:'capital',      ico:flagImg('PE','',''),  title:'Столицы',        sub:'Какой город главный'},
    {id:'marathon',     ico:globe,                title:'Карта мира',     sub:'195 стран, каждая закрашивает карту'}
  ];
  app.innerHTML =
    '<div class="hero">'+
      '<div class="eyebrow">195 стран · 5 частей света</div>'+
      '<h1>Атлас наизусть</h1>'+
      '<p>Три быстрых раунда и марафон, где каждая названная страна загорается на серой карте.</p>'+
    '</div>'+
    '<div class="modes">'+
      modes.map(function(m){
        return '<button class="mode" data-mode="'+m.id+'"><span class="ico">'+m.ico+'</span>'+
          '<span><b>'+m.title+'</b><span class="sub">'+m.sub+'</span></span><span class="go">→</span></button>';
      }).join('')+
    '</div>'+
    '<div class="best">'+
      '<div><strong>'+(store('best_flag2country')||'—')+'</strong><small>Флаги</small></div>'+
      '<div><strong>'+(store('best_capital')||'—')+'</strong><small>Столицы</small></div>'+
      '<div><strong>'+(store('best_marathon')||'—')+'</strong><small>Карта</small></div>'+
    '</div>';
  app.querySelectorAll('.mode').forEach(function(b){ b.onclick = function(){ start(b.dataset.mode); }; });
  setBack(false);
  document.getElementById('tabMenu').classList.add('on');
}

/* ---------- викторины ---------- */
function start(mode){
  document.getElementById('tabMenu').classList.remove('on');
  setBack(true);
  if(mode==='marathon'){ startMarathon(); return; }
  state = {mode:mode, i:0, score:0, answered:false, queue:shuffle(COUNTRIES).slice(0,ROUND)};
  renderQuestion();
}
function modeTitle(m){
  return m==='flag2country' ? 'Флаг → страна' : m==='country2flag' ? 'Страна → флаг' : 'Столицы';
}

function renderQuestion(){
  const s = state, c = s.queue[s.i];
  const options = shuffle(pick(3, c.code).concat([c]));
  let stage, optHtml;

  if(s.mode==='flag2country'){
    stage = flagImg(c.code,'bigflag','Флаг') + '<div class="qhint">чей это флаг</div>';
    optHtml = '<div class="opts">'+options.map(function(o){
      return '<button class="opt" data-code="'+o.code+'">'+esc(o.name)+'</button>';
    }).join('')+'</div>';
  } else if(s.mode==='country2flag'){
    stage = '<div class="qhint">флаг какой страны</div><div class="qtext">'+esc(c.name)+'</div>';
    optHtml = '<div class="flaggrid">'+options.map(function(o){
      return '<button class="opt flagopt" data-code="'+o.code+'">'+flagImg(o.code,'','Вариант')+'</button>';
    }).join('')+'</div>';
  } else {
    stage = flagImg(c.code,'bigflag','Флаг') + '<div class="qhint">столица страны</div><div class="qtext">'+esc(c.name)+'</div>';
    optHtml = '<div class="opts">'+options.map(function(o){
      return '<button class="opt" data-code="'+o.code+'">'+esc(o.capital)+'</button>';
    }).join('')+'</div>';
  }

  app.innerHTML =
    '<div class="topbar"><button class="back" id="back">← меню</button>'+
      '<span class="eyebrow">'+modeTitle(s.mode)+'</span>'+
      '<span class="score">'+s.score+' / '+s.i+'</span></div>'+
    '<div class="bar"><i style="width:'+(s.i/ROUND*100)+'%"></i></div>'+
    '<div class="stage">'+stage+'</div>'+
    optHtml+
    '<div class="feedback" id="fb"></div>';

  document.getElementById('back').onclick = renderMenu;
  app.querySelectorAll('.opt').forEach(function(b){ b.onclick = function(){ answer(b, c); }; });
}

function answer(btn, correct){
  if(state.answered) return;
  state.answered = true;
  const good = btn.dataset.code === correct.code;
  if(good){ state.score++; haptic('success'); } else { haptic('error'); }

  app.querySelectorAll('.opt').forEach(function(b){
    b.disabled = true;
    if(b.dataset.code===correct.code) b.classList.add('ok');
    else if(b===btn) b.classList.add('no');
  });

  const fb = document.getElementById('fb');
  fb.innerHTML = good ? 'Верно.'
    : (state.mode==='capital'
        ? 'Столица — ' + esc(correct.capital) + '.'
        : flagImg(correct.code,'','') + ' <span>' + esc(correct.name) + '</span>');

  const next = document.createElement('button');
  next.className = 'next';
  next.textContent = state.i===ROUND-1 ? 'Итоги' : 'Дальше';
  next.onclick = function(){
    state.i++; state.answered = false;
    if(state.i>=ROUND) renderResult(); else renderQuestion();
  };
  app.appendChild(next);
  next.focus();
}

function renderResult(){
  const s = state;
  const key = 'best_'+s.mode;
  const prev = parseInt(store(key)||'0', 10);
  const record = s.score > prev;
  if(record) store(key, String(s.score));
  let verdict = 'Есть куда расти.';
  if(s.score===ROUND) verdict = 'Безошибочно.';
  else if(s.score>=12) verdict = 'Сильный результат.';
  else if(s.score>=8) verdict = 'Крепкая середина.';

  app.innerHTML =
    '<div class="card result">'+
      '<div class="eyebrow">'+modeTitle(s.mode)+'</div>'+
      '<div class="big">'+s.score+'/'+ROUND+'</div>'+
      '<h2>'+verdict+'</h2>'+
      '<p>'+(record ? 'Новый личный рекорд.' : 'Личный рекорд: '+Math.max(prev,s.score)+'.')+'</p>'+
      '<div class="row"><button class="next" id="again">Ещё раунд</button>'+
      '<button class="ghost" id="menu">В меню</button></div>'+
    '</div>';
  document.getElementById('again').onclick = function(){ start(s.mode); };
  document.getElementById('menu').onclick = renderMenu;
  haptic(record ? 'success' : 'warning');
}

/* ---------- марафон по карте ---------- */
function startMarathon(){
  state = {mode:'marathon', found:{}, count:0, started:Date.now(), timer:null, over:false};
  app.innerHTML =
    '<div class="topbar"><button class="back" id="back">← меню</button>'+
      '<span class="eyebrow">Карта мира</span>'+
      '<span class="score" id="clock">00:00</span></div>'+
    '<div class="mapwrap">'+mapSVG()+'</div>'+
    '<div class="maplegend"><span><i style="background:var(--land)"></i>не названа</span>'+
      '<span><i style="background:var(--accent)"></i>названа</span></div>'+
    '<div class="mstats">'+
      '<div><strong id="mCount">0</strong><small>Названо</small></div>'+
      '<div><strong id="mLeft">'+COUNTRIES.length+'</strong><small>Осталось</small></div>'+
      '<div><strong id="mPct">0%</strong><small>Карта</small></div></div>'+
    '<input id="answer" placeholder="Впиши страну и нажми Enter" autocomplete="off" autocapitalize="off" spellcheck="false">'+
    '<div class="feedback" id="fb">Регистр и «ё» не важны. Разговорные названия тоже засчитываются.</div>'+
    '<div class="regions" id="regions"></div>'+
    '<div class="chips" id="chips"></div>'+
    '<button class="ghost" id="giveup">Сдаться и посмотреть пропущенные</button>';

  document.getElementById('back').onclick = renderMenu;
  document.getElementById('giveup').onclick = finishMarathon;

  const input = document.getElementById('answer');
  input.addEventListener('keydown', function(e){
    if(e.key==='Enter'){ submitCountry(input.value); input.value=''; }
  });
  input.focus();

  state.timer = setInterval(function(){
    const t = ((Date.now()-state.started)/1000)|0;
    const el = document.getElementById('clock');
    if(el) el.textContent = String((t/60|0)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
  }, 1000);

  drawRegions();
}

function submitCountry(text){
  const fb = document.getElementById('fb');
  const code = BY_NORM[norm(text||'')];
  if(!code){ fb.textContent = 'Такой страны в списке нет.'; haptic('error'); return; }
  const c = BY_CODE[code];
  if(state.found[code]){ fb.textContent = c.name + ' уже названа.'; return; }

  state.found[code] = true;
  state.count++;
  paintMap(code, 'on');
  fb.innerHTML = flagImg(code,'','') + '<span>' + esc(c.name) + ' — засчитано</span>';
  haptic('success');

  document.getElementById('mCount').textContent = state.count;
  document.getElementById('mLeft').textContent = COUNTRIES.length - state.count;
  document.getElementById('mPct').textContent = Math.round(state.count/COUNTRIES.length*100)+'%';

  const chip = document.createElement('span');
  chip.className = 'chip';
  chip.innerHTML = flagImg(code,'','') + esc(c.name);
  document.getElementById('chips').prepend(chip);

  drawRegions();
  if(state.count === COUNTRIES.length) finishMarathon();
}

function drawRegions(){
  const box = document.getElementById('regions');
  if(!box) return;
  box.innerHTML = Object.keys(REGIONS).map(function(r){
    const all = COUNTRIES.filter(function(c){return c.region===r;});
    const got = all.filter(function(c){return state.found[c.code];}).length;
    return '<div class="reg"><b>'+REGIONS[r]+'</b><span>'+got+'/'+all.length+'</span>'+
      '<span class="rbar"><i style="width:'+(got/all.length*100)+'%"></i></span></div>';
  }).join('');
}

function finishMarathon(){
  if(state.over) return;
  state.over = true;
  clearInterval(state.timer);
  const t = ((Date.now()-state.started)/1000)|0;
  const time = String((t/60|0)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
  const prev = parseInt(store('best_marathon')||'0',10);
  if(state.count>prev) store('best_marathon', String(state.count));
  const missed = COUNTRIES.filter(function(c){return !state.found[c.code];});
  const found = state.found;

  app.innerHTML =
    '<div class="mapwrap">'+mapSVG()+'</div>'+
    '<div class="maplegend"><span><i style="background:var(--accent)"></i>названа</span>'+
      '<span><i style="background:var(--bad)"></i>пропущена</span></div>'+
    '<div class="card result">'+
      '<div class="eyebrow">Карта мира</div>'+
      '<div class="big">'+state.count+'</div>'+
      '<h2>из '+COUNTRIES.length+' за '+time+'</h2>'+
      '<p>'+(missed.length ? 'Пропущено '+missed.length+'. Они красные на карте и в списке ниже.' : 'Полная карта. Ни одной пропущенной.')+'</p>'+
      '<div class="row"><button class="next" id="again">Заново</button>'+
      '<button class="ghost" id="menu">В меню</button></div>'+
    '</div>'+
    (missed.length ? '<div class="chips">'+missed.map(function(c){
        return '<span class="chip missed">'+flagImg(c.code,'','')+esc(c.name)+'</span>';
      }).join('')+'</div>' : '');

  COUNTRIES.forEach(function(c){ paintMap(c.code, found[c.code] ? 'on' : 'miss'); });
  document.getElementById('again').onclick = startMarathon;
  document.getElementById('menu').onclick = renderMenu;
}

/* ---------- тема и Telegram ---------- */
document.getElementById('tabMenu').onclick = renderMenu;
document.getElementById('tabTheme').onclick = function(){
  const now = document.documentElement.getAttribute('data-theme');
  const next = now==='dark' ? 'light' : now==='light' ? '' : 'dark';
  if(next) document.documentElement.setAttribute('data-theme', next);
  else document.documentElement.removeAttribute('data-theme');
  store('theme', next);
};
try{ const saved = store('theme'); if(saved) document.documentElement.setAttribute('data-theme', saved); }catch(e){}

let tg = null;
try{ tg = window.Telegram && window.Telegram.WebApp; }catch(e){}
function setBack(on){
  if(!tg || !tg.BackButton) return;
  try{ on ? tg.BackButton.show() : tg.BackButton.hide(); }catch(e){}
}

function themeColor(name){
  const dark = (tg && tg.colorScheme==='dark') || document.documentElement.getAttribute('data-theme')==='dark';
  const light = {bg:'#EAEEF0', surface:'#FFFFFF'};
  const darkT  = {bg:'#0A1418', surface:'#112127'};
  return (dark ? darkT : light)[name];
}
function syncChrome(){
  if(!tg) return;
  try{ tg.setHeaderColor(themeColor('surface')); }catch(e){}
  try{ tg.setBackgroundColor(themeColor('bg')); }catch(e){}
  try{ tg.setBottomBarColor(themeColor('surface')); }catch(e){}
}

if(tg){
  try{
    tg.ready();
    tg.expand();
    // Полноразмерный режим (Bot API 8.0+): страница уходит под статус-бар и системную область.
    if(typeof tg.requestFullscreen === 'function') tg.requestFullscreen();
    if(typeof tg.disableVerticalSwipes === 'function') tg.disableVerticalSwipes();
    if(typeof tg.lockOrientation === 'function') tg.lockOrientation();

    if(tg.colorScheme==='dark') document.documentElement.setAttribute('data-theme','dark');
    syncChrome();

    tg.onEvent('themeChanged', function(){
      if(tg.colorScheme==='dark' && !store('theme')) document.documentElement.setAttribute('data-theme','dark');
      syncChrome();
    });
    // safeAreaChanged/contentSafeAreaChanged держат отступы актуальными при входе в fullscreen
    tg.onEvent('safeAreaChanged', applyTgInsets);
    tg.onEvent('contentSafeAreaChanged', applyTgInsets);
    tg.onEvent('fullscreenChanged', applyTgInsets);
    applyTgInsets();

    tg.BackButton.onClick(renderMenu);
  }catch(e){}
}

function applyTgInsets(){
  if(!tg) return;
  try{
    const sa = tg.safeAreaInset || {top:0,bottom:0};
    const csa = tg.contentSafeAreaInset || {top:0,bottom:0};
    document.documentElement.style.setProperty('--tg-inset-top', (sa.top + csa.top) + 'px');
    document.documentElement.style.setProperty('--tg-inset-bottom', (sa.bottom + csa.bottom) + 'px');
  }catch(e){}
}

renderMenu();
</script>
